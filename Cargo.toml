[package]
name = "flurl"
version = "0.7.0"
authors = ["Andrey <amigin@gmail.com>"]
edition = "2021"

[features]
default = []
with-ssh = ["dep:my-ssh"]
# Links the TLS stack: my-tls / rustls, with **ring** as the rustls
# CryptoProvider — hence `ring` in the name. Without this feature the crate never
# pulls rustls in, `with_client_certificate()` does not exist, and an `https://`
# request panics at execute time — see `FlUrl::execute`.
#
# `my-tls/with-ring-crypto-providers` is part of it on purpose: my-tls leaves the
# provider choice to the consumer, and with none installed both
# `create_tls_client_config_ex` and the client-certificate key parsing fail at
# connect time. FlUrl is a client library — turning this on has to give a working
# https, not a build that needs the caller to install a provider first.
#
# ring, not aws-lc-rs: no aws-lc-sys C build is inflicted on consumers. A caller
# who wants a different provider should depend on my-tls directly without this
# feature and install their own.
with-ring-tls = ["dep:my-tls", "my-tls/with-ring-crypto-providers"]
# Enables accept_invalid_certificate(). Dangerous: disables TLS server-cert
# verification. Off by default; without it accept_invalid_certificate() errors at
# connect time instead of silently downgrading security. Implies `with-ring-tls`.
dangerous-tls = ["with-ring-tls", "my-tls/dangerous-tls"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Target-agnostic dependencies, shared by both the native (`non_wasm`) and the
# `wasm` backends. Everything here must compile on wasm32-unknown-unknown.
[dependencies]
# `rnd` gates `rust_extensions::uuid::generate_v4()`, which supplies the
# `multipart/form-data` boundary (see src/body/mod.rs). On wasm that module is
# available without the feature; the feature is what turns it on for native.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "rnd",
] }
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
async-trait = "*"
# Pure-Rust backend so it compiles under wasm too (used by `.compress()`).
flate2 = { version = "*", default-features = false, features = [
    "rust_backend",
] }

# Native backend (`non_wasm`): hyper / tokio / TLS / connection pooling / ssh.
# None of these compile to wasm, so they are excluded from the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper = { version = "*", features = ["full"] }
# Declared explicitly rather than free-ridden off my-http-client's feature
# unification: `net` for Tcp/UnixStream, `io-util` for the split halves of a
# connection, `time` for the request timeout.
tokio = { version = "*", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
] }
hyper-util = { version = "*", features = ["tokio"] }
http-body-util = { version = "*" }
my-http-client = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-http-client.git" }
my-hyper-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-hyper-utils.git" }
my-tls = { tag = "0.1.5", git = "https://github.com/MyJetTools/my-tls.git", optional = true }
http = "*"
bytes = "*"
parking_lot = "*"
ahash = "*"
lazy_static = "*"

# wasm backend (`wasm`): the browser fetch API via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "WorkerGlobalScope",
    "Location",
    "WorkerLocation",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    "DomException",
    "console",
] }

# The streamed-body tests stand up a raw tokio TCP server and read the request off
# the wire themselves, which needs more of tokio than the library does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "*", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }

# SSH is unix-only and therefore never part of the wasm build.
[target.'cfg(unix)'.dependencies]
my-ssh = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-ssh.git", optional = true }
