[package]
name = "flurl"
version = "0.7.0"
authors = ["Andrey <amigin@gmail.com>"]
edition = "2021"

[features]
default = []
with-ssh = ["dep:my-ssh"]

# Internal — do not enable directly, and do not rely on its name. It means "the
# TLS code paths are compiled in"; WHICH provider backs them is the separate
# choice below. Every `#[cfg]` guarding TLS code keys off this, so adding a third
# provider later is one line here instead of ~50 edits across src/.
#
# On its own it compiles the TLS code with no provider installed: an `https://`
# request then fails at connect time with my-tls' "No rustls CryptoProvider is
# installed" error rather than panicking.
_tls = ["dep:my-tls"]

# Pick exactly one of the two provider features. Both enable `https://` and
# `with_client_certificate()`; they differ only in the rustls CryptoProvider.
#
# ring — the default recommendation. Mature and very widely deployed; costs a
# bundled C/assembly build (no aws-lc-sys either way).
with-ring-tls = ["_tls", "my-tls/with-ring-crypto-providers"]

# Pure Rust — no C toolchain anywhere, via rustls-graviola. Trade-offs: it builds
# ONLY on x86_64 and aarch64 (a hard `compile_error!` elsewhere) and the crypto
# implementation is far younger and less deployed than ring. Prefer
# `with-ring-tls` unless getting rid of the C toolchain is the point.
#
# Enabling both — which `--all-features` does — is not an error: my-tls resolves
# the conflict in favour of ring.
with-rust-tls = ["_tls", "my-tls/with-rust-crypto-providers"]

# A modifier, not a TLS switch: it only unlocks accept_invalid_certificate().
# Combine it with a provider feature — on its own the TLS code compiles but no
# provider is installed. Dangerous: disables TLS server-cert verification, and
# even then only for callers that opt in per request.
dangerous-tls = ["_tls", "my-tls/dangerous-tls"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Target-agnostic dependencies, shared by both the native (`non_wasm`) and the
# `wasm` backends. Everything here must compile on wasm32-unknown-unknown.
[dependencies]
# `rnd` gates `rust_extensions::uuid::generate_v4()`, which supplies the
# `multipart/form-data` boundary (see src/body/mod.rs). On wasm that module is
# available without the feature; the feature is what turns it on for native.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "rnd",
] }
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
async-trait = "*"
# Pure-Rust backend so it compiles under wasm too (used by `.compress()`).
flate2 = { version = "*", default-features = false, features = [
    "rust_backend",
] }

# Native backend (`non_wasm`): hyper / tokio / TLS / connection pooling / ssh.
# None of these compile to wasm, so they are excluded from the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper = { version = "*", features = ["full"] }
# Declared explicitly rather than free-ridden off my-http-client's feature
# unification: `net` for Tcp/UnixStream, `io-util` for the split halves of a
# connection, `time` for the request timeout.
tokio = { version = "*", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
] }
hyper-util = { version = "*", features = ["tokio"] }
http-body-util = { version = "*" }
my-http-client = { tag = "0.1.0", git = "https://github.com/my-jet-tools/my-http-client.git" }
my-hyper-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-hyper-utils.git" }
my-tls = { tag = "0.1.5", git = "https://github.com/MyJetTools/my-tls.git", optional = true }
http = "*"
bytes = "*"
parking_lot = "*"
ahash = "*"
lazy_static = "*"

# wasm backend (`wasm`): the browser fetch API via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "WorkerGlobalScope",
    "Location",
    "WorkerLocation",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    "DomException",
    "console",
] }

# The streamed-body tests stand up a raw tokio TCP server and read the request off
# the wire themselves, which needs more of tokio than the library does.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "*", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }

# SSH is unix-only and therefore never part of the wasm build.
[target.'cfg(unix)'.dependencies]
my-ssh = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-ssh.git", optional = true }
